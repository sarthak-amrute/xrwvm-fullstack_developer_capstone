name: CI/CD Pipeline - Car Dealership App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r server/requirements.txt
      - name: Lint with pylint
        run: |
          pylint server/djangoapp/ --fail-under=5.0 || true

  test:
    name: Run Django Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
      - name: Run migrations
        run: |
          cd server
          python manage.py migrate
      - name: Run tests
        run: |
          cd server
          python manage.py test djangoapp

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: |
          docker build -t car-dealership:latest .
      - name: Run container smoke test
        run: |
          docker run -d --name test_app -p 8000:8000 car-dealership:latest
          sleep 10
          curl --fail http://localhost:8000/ || true
          docker stop test_app
          docker rm test_app
